[package]
name = "pcshare-agente"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pcshare-agente"
path = "src/main.rs"

[dependencies]
pcshare-core = { version = "0.0.1", path = "../pcshare-core" }
pcshare-sessao = { version = "0.0.1", path = "../pcshare-sessao" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory"] }
winreg = "0.52"

[build-dependencies]
# Embute o ícone do PCShare no .exe (Explorer, barra de tarefas, download).
winresource = "0.1"
